<body>
    <div class="dashboard">

        <div class="container form-container">
            <div class="container">
                <h2>Nova Atividade</h2>

                <input id="titulo" placeholder="Título">

                <textarea id="descricao" placeholder="Descrição"></textarea>

                <input id="foto" placeholder="URL da imagem (opcional)" oninput="preview()">

                <small style="display:block; margin-top:5px; color:#6b7280;">
                    ⚠️ A imagem precisa ser um link direto (.jpg, .png).
                    Se não souber como fazer:
                    👉 <a href="https://postimages.org/" target="_blank">
                        Enviar imagem no Postimages
                    </a>
                    Pegue o link direto.
                </small>

                <img id="preview" style="display:none;">

                <select id="categoria">
                    <option>Aviso</option>
                    <option>Tarefa</option>
                    <option>Prova</option>
                </select>

                <select id="turma">
                    <option>2A</option>
                    <option>2B</option>
                    <option>2C</option>
                </select>

                <input id="professor" placeholder="Professor">

                <select id="disciplina">
                    <option>Português</option>
                    <option>Matemática</option>
                    <option>Física</option>
                    <option>Química</option>
                    <option>Biologia</option>
                    <option>História</option>
                    <option>Geografia</option>
                    <option>Filosofia</option>
                    <option>Sociologia</option>
                    <option>Inglês</option>
                    <option>Artes</option>
                    <option>Educação Física</option>
                </select>

                <h5>Data de entrega</h5>
                <input type="date" id="dataEntrega">

                <button onclick="criar()">Publicar</button>
                <div id="status" class="status"></div>
            </div>
        </div>

        <div class="container posts-container">
            <div class="container">
                <h2>Posts</h2>
                <div id="lista"></div>
            </div>
        </div>

    </div>

    <div class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️</div>

    <script src="app.js"></script>
</body>

</html>
